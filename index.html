<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Простое MiniApp</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #f5f5f5;
        }

        button {
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
        }
    </style>
</head>

<body>
    <h1>Привет, Telegram!</h1>
    <p>Это самое простое MiniApp приложение.</p>

    <button id="showAlertBtn">Показать alert</button>
    <button id="closeAppBtn">Закрыть приложение</button>

    <p id="userData">Данные пользователя появятся здесь</p>

    <script src="app.js"></script>
</body>

</html>
